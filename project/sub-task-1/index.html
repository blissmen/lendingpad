<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List - Vanila version</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="controller.js"></script>
<link defer href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<div class="page">
    <div class="card">
        <div class="main-content">
            <div class="list-section" id="listSection">
          
                <button class="filter-toggle" (click)="openFilterPanel()">Filters</button>

                <div class="filters-container" [class.open]="mobileFilterOpen">

                    <div class="filters-header">
                        <span>FILTERS</span>
                        <button class="close-btn" (click)="mobileFilterOpen = false">&times;</button>
                    </div>
      <h1 class="header">Creation Date:</h1>
                    <div class="date-filters">
                        <input type="date" id="startDateInput" placeholder="mm/dd/yyyy">
                        <span class="date-separator">–</span>
                        <input type="date"  id ="endDateInput" placeholder="mm/dd/yyyy">
                    </div>
                    <div class="filter-buttons">
                    
                           <button class="btn-primary" id="applyFilterBtn">APPLY</button>
                        <button class="btn-secondary" id="resetFilterBtn">RESET</button>
                     
                    </div>
                </div>

                <table class="todo-table">
                    <thead>
                        <tr>
                            <th><!-- Checkbox column header (for select-all, left empty) --></th>
                            <th id="nameHeader" class="display-flex" >
                                <span>Name </span>
                                <span id="nameSortIndicator"></span>
                            </th>
                            <th (click)="sortBy('date')">
                            <th id="dateHeader" class="display-flex" (click)="sortBy('date')">
                                <span>Creation Date </span>
                              <span id="dateSortIndicator"></span>
                            </th>
                            <th><!-- Actions column --></th>
                        </tr>
                    </thead>
                    <tbody id="todoTbody">
                      
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- Right section: description edit panel (visible when an item is selected) -->


    <div class="edit-overlay hidden" id="panelSection" >
        <div class="edit-backdrop" id="editBackdrop" (click)="closePanel()"></div>

        <div class="edit-panel">
            <div class="panel-header">
             
                  <button class="btn-primary" id="saveDescBtn">SAVE</button>

                </button>
                <button class="btn-secondary" id="closeDescBtn" >CLOSE</button>
         
            </div>

            <div class="panel-content">
                <label for="descTextarea">Description</label>
                <textarea id="descTextarea"></textarea>
            </div>
        </div>
    </div>
    
</div>
