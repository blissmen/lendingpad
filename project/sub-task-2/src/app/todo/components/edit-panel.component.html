<div class="panel-container">
  <div class="panel-header">
    <button class="btn-primary save-btn" (click)="onSave()">Save</button>
    <button class="btn-secondary close-btn" (click)="onClose()">Close</button>
  </div>
  <div class="panel-content">
    <label for="desc">Description:</label>
    <textarea id="desc" [(ngModel)]="descriptionDraft"></textarea>
  </div>
</div>
